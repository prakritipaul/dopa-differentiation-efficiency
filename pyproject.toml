[project]
name = "pluricon-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prakriti Chacha", email = "pprakriti16@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
]

[project.scripts]
pluricon-prototype = "pluricon_prototype:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: streams real single-cell data / runs the extraction pipeline (deselect with -m 'not slow')",
]
