[project]
name = "dopa-differentiation-efficiency"
version = "0.1.0"
description = "Predicting day-52 dopaminergic neuron yield from day-11 and day-30 single-cell RNA-seq, across 136 iPSC lines (Jerber et al. 2021)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
]

# No [project.scripts] and no build-system: this is a research pipeline, run
# via `uv run python -m modeling.<module>` and `uv run python eda/<script>.py`,
# not a library anyone installs. It previously declared a `uv_build` backend
# and shipped src/pluricon_prototype/, which contained only uv init's
# hello-world `main()` -- nothing imported it, and the console script it
# registered just printed a greeting. Removing both means `uv sync` installs
# the dependencies and nothing else, which is what the project actually needs.

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: streams real single-cell data / runs the extraction pipeline (deselect with -m 'not slow')",
    "requires_data: needs the h5 files, which are not in the repo; auto-skipped when absent",
]
